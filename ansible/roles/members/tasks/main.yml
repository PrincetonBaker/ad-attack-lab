- name: Point DNS at DC
  ansible.windows.win_dns_client:
    adapter_names: "*"
    dns_servers: ["{{ dc_ip }}"]
- name: Join domain
  microsoft.ad.membership:
    dns_domain_name: "{{ domain_name }}"
    domain_admin_user: "vagrant@{{ domain_name }}"
    domain_admin_password: "{{ domain_admin_password }}"
    state: domain
    reboot: true
