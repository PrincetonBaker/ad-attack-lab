- name: Install AD CS + Web Enrollment (ESC8 surface)
  ansible.windows.win_feature:
    name: [ADCS-Cert-Authority, ADCS-Web-Enrollment]
    include_management_tools: true
- name: Configure Enterprise Root CA
  ansible.windows.win_shell: |
    Install-AdcsCertificationAuthority -CAType EnterpriseRootCA -CACommonName "CORP-CA01-CA" -Force
  args: { creates: C:\Windows\System32\CertLog }
- name: Configure Web Enrollment over HTTP with NTLM and no EPA (ESC8, intentional)
  ansible.windows.win_shell: Install-AdcsWebEnrollment -Force
  ignore_errors: true
